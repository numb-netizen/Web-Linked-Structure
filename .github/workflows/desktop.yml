name: Build desktop apps
on:
  push:
    paths: ['desktop/**', 'site/**', 'tests/desktop*.cjs', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Test URL policy
        run: node --test ../tests/desktop.test.cjs
      - name: Test offline app on Linux
        if: matrix.platform == 'linux'
        env:
          HSC_DESKTOP_SMOKE: '1'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Test offline app on Windows
        if: matrix.platform == 'windows'
        env:
          HSC_DESKTOP_SMOKE: '1'
        run: npm run smoke
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: npm run dist:linux
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npm run dist:win
      - name: Smoke test packaged Linux app
        if: matrix.platform == 'linux'
        env:
          HSC_DESKTOP_SMOKE: '1'
        run: xvfb-run -a ./dist/linux-unpacked/chugc-study-portal --no-sandbox
      - name: Smoke test packaged Windows app
        if: matrix.platform == 'windows'
        env:
          HSC_DESKTOP_SMOKE: '1'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/win-unpacked/CHUGC Study Portal.exe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged app test failed with exit code $($p.ExitCode)" }
      - name: Exercise Windows signing with a throwaway untrusted certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/test-signing.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CHUGC-Study-Portal-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
